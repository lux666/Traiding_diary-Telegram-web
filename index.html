<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XAUUSD Журнал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f5f8;--cd:#fff;--tx:#14202b;--mu:#667689;--ac:#d99a0b;--ok:#0f9d8a;--bad:#e5484d;--bd:#e0e6ed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1319;--cd:#17202a;--tx:#e8edf2;--mu:#8b98a8;--ac:#f2b53a;--ok:#2bbfa9;--bad:#f0605f;--bd:#243140}}
:root[data-theme=dark]{--bg:#0e1319;--cd:#17202a;--tx:#e8edf2;--mu:#8b98a8;--ac:#f2b53a;--ok:#2bbfa9;--bad:#f0605f;--bd:#243140}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:12px}h1{font-size:18px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:var(--bg);border-radius:10px;padding:8px}.m b{display:block;font-size:17px}.mu{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
button{cursor:pointer;background:var(--ac);color:#111;border:0;font-weight:600}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.r{display:flex;gap:8px}.r>*{flex:1}.ch{display:flex;flex-wrap:wrap;gap:6px}.ch span{padding:6px 10px;border:1px solid var(--bd);border-radius:20px;font-size:13px;cursor:pointer}.ch span.on{background:var(--ac);color:#111;border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mu);border:0;font-size:12px;padding:6px 2px}nav button.on{color:var(--ac)}nav button i{display:block;font-style:normal;font-size:19px}
.w{display:none;background:var(--bad);color:#fff;padding:10px;border-radius:10px;margin-bottom:10px}.t{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:13px}.t img{width:36px;height:36px;object-fit:cover;border-radius:6px}
svg{width:100%;height:130px;display:block}.x{background:none;color:var(--bad);width:auto;padding:0 6px;font-size:16px}
</style></head><body><main>
<div class="w" id="warn"></div>
<section id="p0"><h1>📊 Дашборд</h1>
<div class="c"><div class="r"><select id="fs"><option value="">Все сессии</option><option>Asia</option><option>London</option><option>NY</option></select><select id="fd"><option value="">Все дни</option><option value="1">Пн</option><option value="2">Вт</option><option value="3">Ср</option><option value="4">Чт</option><option value="5">Пт</option></select></div></div>
<div class="c"><h2>Эквити</h2><div id="eq"></div></div><div class="c"><div class="g" id="mt"></div></div>
<div class="c"><h2>Последние сделки</h2><div id="ls"></div><div class="r" style="margin-top:8px"><button class="s" id="demo">Демо-данные</button><button class="s" id="clr">Очистить всё</button></div></div></section>
<section id="p1" hidden><h1>➕ Добавить сделку</h1><div class="c">
<div class="r"><div><label>Инструмент</label><input id="sy" list="sl" value="XAUUSD"><datalist id="sl"><option>XAUUSD<option>GOLD<option>XAUUSD.m</datalist></div><div><label>Лот</label><input id="lt" type="number" step="0.01" value="0.1"></div></div>
<label>Тип</label><div class="r"><button class="s" id="dl">Long</button><button class="s" id="ds">Short</button></div>
<div class="r"><div><label>Вход</label><input id="en" type="number" step="0.01"></div><div><label>Стоп-лосс</label><input id="sl2" type="number" step="0.01"></div></div>
<div class="r"><div><label>Тейк-профит</label><input id="tp" type="number" step="0.01"></div><div><label>Выход (если закрыта)</label><input id="ex" type="number" step="0.01"></div></div>
<div class="m" style="margin-top:8px" id="pv">Риск: — · R:R: —</div>
<label>Сетап</label><div class="ch" id="cs"></div><label>Сессия</label><div class="ch" id="cn"></div>
<label>Тильт / эмоции: <b id="tv">3</b>/10</label><input id="tl" type="range" min="1" max="10" value="3">
<label><input id="pl" type="checkbox" style="width:auto" checked> Сделка была по плану</label>
<label>Заметка</label><textarea id="nt" rows="2"></textarea><label>Скриншот графика</label><input id="sh" type="file" accept="image/*">
<button id="sv" style="margin-top:10px">Сохранить сделку</button></div></section>
<section id="p2" hidden><h1>🧠 Психо-дневник</h1>
<div class="c"><h2>Утренний чек-ин</h2><label>Энергия: <b id="ev">5</b>/10</label><input id="e1" type="range" min="1" max="10" value="5"><label>Фокус: <b id="fv">5</b>/10</label><input id="e2" type="range" min="1" max="10" value="5"><label>Торговый план на день</label><textarea id="e3" rows="3"></textarea><button id="e4" style="margin-top:8px">Сохранить чек-ин</button></div>
<div class="c"><h2>Лимит дня</h2><label>Макс. дневной убыток, $</label><input id="lm" type="number" step="1"><div class="mu" id="lmi" style="margin-top:6px"></div></div>
<div class="c"><h2>Статистика тильта</h2><div id="tt" class="mu"></div></div></section>
<section id="p3" hidden><h1>🤖 AI-Аналитик</h1><div class="c"><button id="ai">Проанализировать мои ошибки (7 дней)</button><div id="ao" style="margin-top:10px"></div><div class="mu" style="margin-top:8px">Анализ считается локально по правилам. Чтобы отправлять статистику в LLM, укажи адрес своего бэкенда в константе ENDPOINT.</div></div></section>
</main>
<nav><button class="on" data-p="0"><i>📊</i>Дашборд</button><button data-p="1"><i>➕</i>Сделка</button><button data-p="2"><i>🧠</i>Психо</button><button data-p="3"><i>🤖</i>AI</button></nav>
<script>
const CT=100,PIP=0.1,ENDPOINT="",SETUPS=["FVG","Order Block","Liquidity Sweep","BOS"],SESS=["Asia","London Open","Pre-NY","NY Open"],GRP={Asia:["Asia"],London:["London Open"],NY:["Pre-NY","NY Open"]};
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme}
const $=i=>document.getElementById(i),ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){msg("Память заполнена: удали старые сделки")}};
const msg=m=>tg&&tg.showAlert?tg.showAlert(m):alert(m),esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),f=(n,d=2)=>n==null||isNaN(n)?"—":Number(n).toFixed(d);
let T=ld("xt",[]),CK=ld("xc",{}),ST=ld("xs",{limit:0}),dir="L",sets=new Set,sess="London Open",shot="";
const day=ts=>new Date(ts).toISOString().slice(0,10);
function calc(t){const s=t.dir=="L"?1:-1,risk=Math.abs(t.entry-t.sl)*CT*t.lot,cl=t.exit!=null&&t.exit!=="",pnl=cl?(t.exit-t.entry)*s*CT*t.lot:null;return{risk,pnl,pips:cl?(t.exit-t.entry)*s/PIP:null,rr:t.tp?Math.abs(t.tp-t.entry)/Math.abs(t.entry-t.sl):null,r:cl&&risk?pnl/risk:null}}
const closed=L=>L.map(t=>({t,...calc(t)})).filter(x=>x.pnl!=null).sort((a,b)=>a.t.ts-b.t.ts);
const sum=a=>a.reduce((p,c)=>p+c,0);
function stats(L){const c=closed(L),w=c.filter(x=>x.pnl>0),l=c.filter(x=>x.pnl<0);let e=0,pk=0,dd=0;const eq=c.map(x=>(e+=x.pnl,pk=Math.max(pk,e),dd=Math.max(dd,pk-e),e));
const gp=sum(w.map(x=>x.pnl)),gl=-sum(l.map(x=>x.pnl));return{n:c.length,wr:c.length?w.length/c.length*100:null,pf:gl?gp/gl:null,pnl:e,pips:sum(c.map(x=>x.pips)),aw:w.length?gp/w.length:0,al:l.length?gl/l.length:0,rr:c.length?sum(c.map(x=>x.rr||0))/c.length:null,dd,eq,c}}
function filt(){const s=$("fs").value,d=$("fd").value;return T.filter(t=>(!s||GRP[s].includes(t.session))&&(!d||new Date(t.ts).getDay()==d))}
function chart(eq){if(eq.length<2)return'<div class="mu">Нужно минимум 2 закрытые сделки</div>';const w=320,h=120,mn=Math.min(0,...eq),mx=Math.max(0,...eq),r=mx-mn||1,y=v=>h-(v-mn)/r*h;
const d=eq.map((v,i)=>(i?"L":"M")+(i/(eq.length-1)*w).toFixed(1)+" "+y(v).toFixed(1)).join(""),c=eq[eq.length-1]>=0?"var(--ok)":"var(--bad)";
return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bd)" stroke-dasharray="3"/><path d="${d}L${w} ${y(0)}L0 ${y(0)}Z" fill="${c}" opacity=".12"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function todayLoss(){const d=day(Date.now());return sum(closed(T).filter(x=>day(x.t.ts)==d).map(x=>x.pnl))}
function warn(){const w=$("warn"),p=todayLoss();if(ST.limit>0&&p<=-ST.limit){w.style.display="block";w.textContent="⛔ Дневной лимит убытка достигнут ("+f(p)+" $). Остановись на сегодня."}else w.style.display="none"}
function dash(){const s=stats(filt());$("eq").innerHTML=chart(s.eq);const cl=v=>v==null?"":v>=0?"ok":"bad";
$("mt").innerHTML=[["Winrate",s.wr==null?"—":f(s.wr,1)+"%",""],["Profit Factor",f(s.pf),""],["PnL, $",f(s.pnl),cl(s.pnl)],["PnL, пипсы",f(s.pips,0),cl(s.pips)],["Ср. R:R (план)",f(s.rr),""],["Макс. просадка, $",f(s.dd),s.dd?"bad":""]].map(m=>`<div class="m"><span class="mu">${m[0]}</span><b class="${m[2]}">${m[1]}</b></div>`).join("");
$("ls").innerHTML=T.slice().sort((a,b)=>b.ts-a.ts).slice(0,6).map(t=>{const c=calc(t);return`<div class="t"><div>${t.shot?`<img src="${t.shot}">`:""}</div><div style="flex:1"><b>${t.dir=="L"?"Long":"Short"} ${esc(t.sym)} ${t.lot}</b><div class="mu">${new Date(t.ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${esc(t.session)} · ${esc((t.setup||[]).join(", "))}</div></div><div class="${c.pnl>=0?"ok":"bad"}"><b>${c.pnl==null?"открыта":f(c.pnl)+" $"}</b></div><button class="x" data-del="${t.id}">×</button></div>`}).join("")||'<div class="mu">Пока нет сделок</div>'}
function chips(el,list,multi,get,set){el.innerHTML=list.map(x=>`<span data-v="${x}" class="${get(x)?"on":""}">${x}</span>`).join("");el.onclick=e=>{const v=e.target.dataset.v;if(!v)return;set(v);chips(el,list,multi,get,set);prev()}}
function prev(){const t=read(),c=calc(t);$("pv").textContent=isNaN(c.risk)||!c.risk?"Риск: — · R:R: —":"Риск: "+f(c.risk)+" $ · R:R: "+f(c.rr)}
function read(){return{dir,lot:+$("lt").value,entry:+$("en").value,sl:+$("sl2").value,tp:+$("tp").value,exit:$("ex").value===""?null:+$("ex").value}}
function tilt(){const c=closed(T);let n=0,up=0;for(let i=2;i<c.length;i++){const a=c[i-2],b=c[i-1],x=c[i];if(day(a.t.ts)==day(x.t.ts)&&a.pnl<0&&b.pnl<0){n++;if(x.t.lot>b.t.lot)up++}}
$("tt").innerHTML=n?`После 2 убытков подряд (случаев: ${n}) лот увеличивается в <b>${Math.round(up/n*100)}%</b> случаев.`:"Недостаточно данных: нужны серии из 2 убытков подряд.";
const l=$("lmi"),p=todayLoss();l.textContent="Сегодня: "+f(p)+" $"+(ST.limit>0?" · лимит −"+ST.limit+" $":"");$("lm").value=ST.limit||""}
function analyze(){const w=Date.now()-7*864e5,c=closed(T.filter(t=>t.ts>=w)),s=stats(T.filter(t=>t.ts>=w)),o=[];if(c.length<3)return{s,o:["Мало данных: нужно минимум 3 закрытые сделки за 7 дней."]};
if(s.aw&&s.al/s.aw>1.2)o.push(`Средний убыток ($${f(s.al)}) больше среднего профита ($${f(s.aw)}) в ${f(s.al/s.aw)} раза: убытки держатся дольше профитов или стоп переносится.`);
const off=c.filter(x=>x.t.plan===false);if(off.length){const a=sum(off.map(x=>x.pnl)),b=sum(c.filter(x=>x.t.plan!==false).map(x=>x.pnl));o.push(`Сделок не по плану: ${off.length}, их PnL ${f(a)} $ против ${f(b)} $ по плану.`)}
const hi=c.filter(x=>x.t.tilt>=7);if(hi.length){o.push(`При тильте ≥7 открыто ${hi.length} сделок, PnL ${f(sum(hi.map(x=>x.pnl)))} $.`)}
const by={};c.forEach(x=>(x.t.setup||[]).forEach(k=>(by[k]=by[k]||[]).push(x.pnl)));const e=Object.entries(by).map(([k,v])=>[k,sum(v)/v.length,v.length]).sort((a,b)=>a[1]-b[1]);if(e.length)o.push(`Худший сетап: ${e[0][0]} (ср. ${f(e[0][1])} $, ${e[0][2]} сд.)`+(e.length>1?`; лучший: ${e[e.length-1][0]} (ср. ${f(e[e.length-1][1])} $).`:"."));
if(s.dd>0&&s.pnl<0)o.push("Неделя в минусе: просадка "+f(s.dd)+" $. Сократи лот до разбора ошибок.");return{s,o:o.length?o:["Явных системных ошибок за неделю не найдено."]}}
function show(i){document.querySelectorAll("section").forEach((s,k)=>s.hidden=k!=i);document.querySelectorAll("nav button").forEach((b,k)=>b.classList.toggle("on",k==i));if(i==0)dash();if(i==2)tilt();window.scrollTo(0,0)}
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b)show(+b.dataset.p)};
$("fs").onchange=$("fd").onchange=dash;["lt","en","sl2","tp","ex"].forEach(i=>$(i).oninput=prev);
$("dl").onclick=()=>{dir="L";dirUi()};$("ds").onclick=()=>{dir="S";dirUi();};function dirUi(){$("dl").style.outline=dir=="L"?"2px solid var(--ok)":"none";$("ds").style.outline=dir=="S"?"2px solid var(--bad)":"none";prev()}
$("tl").oninput=()=>$("tv").textContent=$("tl").value;$("e1").oninput=()=>$("ev").textContent=$("e1").value;$("e2").oninput=()=>$("fv").textContent=$("e2").value;
$("sh").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,640/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);shot=c.toDataURL("image/jpeg",.6)};im.src=r.result};r.readAsDataURL(fl)};
$("sv").onclick=()=>{const t=read();if(!t.entry||!t.sl||!t.lot||t.entry==t.sl){msg("Укажи лот, вход и стоп-лосс (стоп не равен входу).");return}
T.push({id:Date.now(),ts:Date.now(),sym:$("sy").value||"XAUUSD",...t,tp:t.tp||null,setup:[...sets],session:sess,tilt:+$("tl").value,plan:$("pl").checked,note:$("nt").value,shot});sv("xt",T);shot="";$("sh").value="";["en","sl2","tp","ex","nt"].forEach(i=>$(i).value="");
if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred("success");warn();if(ST.limit>0&&todayLoss()<=-ST.limit)msg("Дневной лимит убытка достигнут. Хватит на сегодня.");show(0)};
$("ls").onclick=e=>{const id=e.target.dataset.del;if(id){T=T.filter(t=>t.id!=id);sv("xt",T);dash();warn()}};
$("e4").onclick=()=>{CK[day(Date.now())]={e:+$("e1").value,f:+$("e2").value,p:$("e3").value};sv("xc",CK);msg("Чек-ин сохранён")};
$("lm").onchange=()=>{ST.limit=Math.max(0,+$("lm").value||0);sv("xs",ST);tilt();warn()};
$("ai").onclick=async()=>{const r=analyze(),o=$("ao");o.innerHTML=r.o.map(x=>`<p>• ${esc(x)}</p>`).join("");if(ENDPOINT){o.innerHTML+='<p class="mu">Отправляю статистику в LLM…</p>';try{const q=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stats:{n:r.s.n,wr:r.s.wr,pf:r.s.pf,pnl:r.s.pnl,avgWin:r.s.aw,avgLoss:r.s.al,dd:r.s.dd},findings:r.o})});o.innerHTML+=`<p><b>${esc((await q.json()).verdict||"")}</b></p>`}catch(e){o.innerHTML+='<p class="bad">Бэкенд недоступен</p>'}}};
$("demo").onclick=()=>{let p=2330;for(let i=0;i<24;i++){const L=Math.random()<.55,d=L?1:-1,w=Math.random()<.45,e=p+Math.random()*10,r=3+Math.random()*3,x=e+d*(w?r*(1+Math.random()):-r*(1+Math.random()*.6));T.push({id:Date.now()+i,ts:Date.now()-(24-i)*8*36e5,sym:"XAUUSD",dir:L?"L":"S",lot:i%7==6?.2:.1,entry:+e.toFixed(2),sl:+(e-d*r).toFixed(2),tp:+(e+d*2*r).toFixed(2),exit:+x.toFixed(2),setup:[SETUPS[i%4]],session:SESS[i%4],tilt:1+i%9,plan:i%5!=0,note:""})}sv("xt",T);dash()};
$("clr").onclick=()=>{if(confirm("Удалить все сделки?")){T=[];sv("xt",T);dash()}};
chips($("cs"),SETUPS,1,x=>sets.has(x),x=>sets.has(x)?sets.delete(x):sets.add(x));chips($("cn"),SESS,0,x=>sess==x,x=>sess=x);
const c0=CK[day(Date.now())];if(c0){$("e1").value=c0.e;$("e2").value=c0.f;$("e3").value=c0.p;$("ev").textContent=c0.e;$("fv").textContent=c0.f}
dirUi();warn();dash();
</script></body></html>
